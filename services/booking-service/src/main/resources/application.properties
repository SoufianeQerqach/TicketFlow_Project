spring.application.name=booking-service
server.port=8083

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# OpenFeign: The client calls "event-service" by name.
# Set EVENT_SERVICE_URL to bypass Eureka (e.g., http://localhost:8082 when only event-service runs locally)
ticketflow.clients.event-service.url=${EVENT_SERVICE_URL:}

# Resilience4j Circuit Breaker (TP5)
ticketflow.resilience.event-service.sliding-window-size=10
ticketflow.resilience.event-service.minimum-number-of-calls=5
ticketflow.resilience.event-service.failure-rate-threshold=50
ticketflow.resilience.event-service.wait-in-open-state=10s
ticketflow.resilience.event-service.permitted-calls-in-half-open-state=3
ticketflow.resilience.event-service.time-limit=4s

# OpenFeign timeouts
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# OpenFeign Circuit Breaker integration
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
